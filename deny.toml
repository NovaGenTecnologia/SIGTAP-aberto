# Auditoria de licenças das dependências. O SIGTAP Aberto é AGPL-3.0-only; só entram
# dependências com licença compatível. Qualquer licença fora desta lista reprova o build.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "AGPL-3.0-only",
]

# Exceções por pacote, com motivo.
[[licenses.exceptions]]
# Lista de certificados raiz da Mozilla (dados, não código), usada pelo verificador de
# certificados quando o sistema não tem os seus. CDLA-Permissive-2.0 é licença permissiva de
# dados: só exige manter o texto da licença; não impõe condição sobre o programa.
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
