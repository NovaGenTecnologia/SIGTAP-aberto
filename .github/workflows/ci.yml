# Integração contínua do SIGTAP Aberto: testes e auditoria de licenças nos três sistemas.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Rust (versão de rust-toolchain.toml)
        run: rustup show
      - name: Formatação
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes
        run: cargo test --workspace --locked

  licencas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/app/web/package-lock.json
      - name: Dependências
        run: npm ci
      - name: Tipos e compilação
        run: npm run build
      - name: Testes
        run: npm test
      - name: Licenças das dependências
        run: npm run licencas
