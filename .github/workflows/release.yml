# Lançamento: ao publicar uma tag vX.Y.Z, testa, monta os pacotes de todos os sistemas
# (pacotes.yml) e publica o lançamento com:
#   - os arquivos prontos para baixar e rodar (.exe, .zip, .AppImage, .zip do macOS);
#   - SHA256SUMS.txt com o SHA-256 de cada arquivo (o atualizador do programa confere por ele);
#   - as notas de docs/lancamentos/vX.Y.Z.md, com uma tabela de downloads gerada aqui.
name: lancamento

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  conferir:
    name: Conferir versão e testar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust (versão de rust-toolchain.toml)
        run: rustup show
      - name: A tag tem de ser a versão do programa, e as notas têm de existir
        shell: bash
        run: |
          versao=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tauri=$(grep -m1 '"version"' crates/app/tauri.conf.json | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          [ "v$versao" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} diferente da versão $versao do Cargo.toml"; exit 1; }
          [ "$versao" = "$tauri" ] || { echo "tauri.conf.json ($tauri) diferente do Cargo.toml ($versao)"; exit 1; }
          [ -f "docs/lancamentos/${GITHUB_REF_NAME}.md" ] || { echo "Faltam as notas docs/lancamentos/${GITHUB_REF_NAME}.md"; exit 1; }
      - name: Testes
        run: cargo test --workspace --locked

  pacotes:
    needs: conferir
    uses: ./.github/workflows/pacotes.yml

  publicar:
    name: Publicar o lançamento
    needs: pacotes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pacote-*
          path: pacotes
          merge-multiple: true
      - name: SHA256SUMS.txt e tabela de downloads
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd pacotes
          ls -la
          for esperado in windows-x64.exe windows-arm64.exe windows-x64.zip windows-arm64.zip \
                          linux-x64.AppImage linux-arm64.AppImage macos-universal.zip; do
            [ -f "SIGTAP-Aberto-${TAG}-${esperado}" ] || { echo "Falta o pacote ${esperado}"; exit 1; }
          done
          sha256sum SIGTAP-Aberto-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          base="https://github.com/${REPO}/releases/download/${TAG}"
          linha() { echo "| $1 | [$2](${base}/$2) | $(du -m "$2" | cut -f1) MB |"; }
          {
            echo "## Baixe e rode"
            echo
            echo "| Sistema | Arquivo | Tamanho |"
            echo "|---|---|---|"
            linha "Windows (Intel/AMD, a maioria)" "SIGTAP-Aberto-${TAG}-windows-x64.exe"
            linha "Windows ARM (Snapdragon)" "SIGTAP-Aberto-${TAG}-windows-arm64.exe"
            linha "Linux (Intel/AMD)" "SIGTAP-Aberto-${TAG}-linux-x64.AppImage"
            linha "Linux ARM" "SIGTAP-Aberto-${TAG}-linux-arm64.AppImage"
            linha "macOS (Intel e Apple)" "SIGTAP-Aberto-${TAG}-macos-universal.zip"
            echo
            echo "- **Windows:** baixe o \`.exe\`, coloque numa pasta sua (ex.: \`D:\\SIGTAP Aberto\`) e abra. Se aparecer o aviso azul do Windows: *Mais informações* → *Executar assim mesmo* (o programa ainda não tem assinatura digital). Prefere com instruções? Baixe o \`.zip\` do mesmo sistema: ele traz o LEIAME."
            echo "- **Linux:** baixe o \`.AppImage\`, coloque numa pasta sua, marque como executável (\`chmod +x\`) e abra. Em distribuições sem FUSE 2, instale \`libfuse2\` ou rode com \`--appimage-extract-and-run\`."
            echo "- **macOS:** extraia o \`.zip\`, arraste a pasta *SIGTAP Aberto* para Documentos e abra o app com botão direito → *Abrir* (o programa ainda não tem assinatura da Apple)."
            echo
            echo "O programa grava os dados ao lado de si mesmo, nunca em pastas do sistema. Confira o download pelo \`SHA256SUMS.txt\`."
            echo
            cat "../docs/lancamentos/${TAG}.md"
          } > ../notas.md
      - name: Criar o rascunho com os arquivos
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: notas.md
          files: |
            pacotes/SIGTAP-Aberto-*
            pacotes/SHA256SUMS.txt
      - name: Publicar (os arquivos já estão anexados; depois disso a release não muda)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false
