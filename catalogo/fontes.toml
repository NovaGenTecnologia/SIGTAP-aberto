# Catálogo das fontes oficiais do SIGTAP Aberto.
# Uma entrada por fonte. É dado, não código: as fases seguintes leem este arquivo.
# Campos:
#   origem          URL ou caminho oficial (sem espelhos)
#   padrao          padrão do nome do arquivo; {UF} sigla, {AAMM}/{AAAAMM} competência
#   formato         zip-txt-largura-fixa | dbc | dbf | json-api | xlsx | pdf | xsd
#   escopos         brasil | uf | regiao-saude | municipio | cnes
#   periodicidade   mensal | diaria | eventual
#   leiaute         de onde vem o leiaute (sempre oficial)
#   campos_pessoais o que é pessoal e como é tratado
#   licenca         situação conhecida (docs/fontes/licenca-dos-dados.md)
#   fase            fase do plano em que entra
#   obrigatorio     entra na primeira execução?
#   estudo          ficha de estudo em docs/fontes/

[sigtap]
nome = "Tabela Unificada de Procedimentos (SIGTAP)"
origem = "ftp://ftp2.datasus.gov.br/pub/sistemas/tup/downloads/"
padrao = "TabelaUnificada_{AAAAMM}_v{AAMMDDhhmm}.zip (até 200904 sem _v)"
formato = "zip-txt-largura-fixa"
escopos = ["brasil"]
periodicidade = "mensal"
leiaute = "<tabela>_layout.txt dentro do próprio ZIP"
campos_pessoais = "nenhum"
licenca = "não declarada no FTP"
fase = 1
obrigatorio = true
estudo = "docs/fontes/sigtap-acessorios.md"
tamanho = "~2,2 MB por competência; 225 competências, 441 MB (200801–202609)"

[sigtap_notas_tecnicas]
nome = "Notas técnicas mensais do SIGTAP"
origem = "ftp://ftp2.datasus.gov.br/pub/sistemas/tup/downloads/notastecnicas/"
padrao = "nota_tecnica_cgsi_sigtap_{AAAA}_{MM}.pdf"
formato = "pdf"
escopos = ["brasil"]
periodicidade = "mensal"
leiaute = "não se aplica (texto)"
campos_pessoais = "nenhum"
licenca = "não declarada no FTP"
fase = 2
obrigatorio = false
estudo = "docs/fontes/sigtap-acessorios.md"

