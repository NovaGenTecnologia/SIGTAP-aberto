# CNES de disseminação (arquivos .dbc do FTP do DATASUS): o que o programa carrega, o que descarta
# por privacidade, como decodifica os códigos e como liga leitos do CNES aos tipos de leito do SIGTAP.
# Tudo aqui é dado: o código não tem nome de campo nem posição fixa (o esquema vem do próprio .dbc).
#
# Origens:
#   - Informe Técnico "IT_CNES_1706.pdf" (DATASUS, 06/2017), em
#     ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/doc/: campos de cada arquivo.
#   - TAB_CNES.zip (15/09/2026), em .../CNES/200508_/Auxiliar/: arquivos .def (qual tabela decodifica
#     cada campo), CNV\*.cnv (as tabelas) e DBF\CADGER<UF>.dbf (nome dos estabelecimentos).
#   - Arquivos reais de MS de 200801, 201201, 201601, 202001, 202401 e 202608: os campos mudam com
#     o tempo (NAT_JUR entra em 2016; sete campos APxxCV07 em ST entram depois de 2020).

origem = "IT_CNES_1706.pdf e TAB_CNES.zip de 15/09/2026 (FTP do DATASUS); conferido nos .dbc de MS de 2008 a 2026"

# ---- Arquivos ----
# `chave`: campos que têm de existir (sem eles o arquivo é recusado).
# `indices`: consultas do programa. `so_cnes_escolhidos`: só entra o que for dos CNES do usuário.

[[tipo]]
codigo = "ST"
nome = "Estabelecimentos"
chave = ["CNES", "CODUFMUN", "COMPETEN"]
indices = [["CNES"], ["CODUFMUN"]]

[[tipo]]
codigo = "HB"
nome = "Habilitações"
chave = ["CNES", "CODUFMUN", "SGRUPHAB", "CMPT_INI", "CMPT_FIM", "COMPETEN"]
indices = [["CNES"], ["SGRUPHAB"]]

[[tipo]]
codigo = "SR"
nome = "Serviços especializados"
chave = ["CNES", "CODUFMUN", "SERV_ESP", "CLASS_SR", "COMPETEN"]
indices = [["CNES"], ["SERV_ESP", "CLASS_SR"]]

[[tipo]]
codigo = "LT"
nome = "Leitos"
chave = ["CNES", "CODUFMUN", "TP_LEITO", "CODLEITO", "QT_EXIST", "QT_SUS", "COMPETEN"]
indices = [["CNES"], ["CODLEITO"]]

[[tipo]]
codigo = "EQ"
nome = "Equipamentos"
chave = ["CNES", "CODUFMUN", "TIPEQUIP", "CODEQUIP", "QT_EXIST", "COMPETEN"]
indices = [["CNES"]]

[[tipo]]
codigo = "PF"
nome = "Profissionais"
chave = ["CNES", "CODUFMUN", "CBO", "COMPETEN"]
indices = [["CNES"], ["CBO"]]
so_cnes_escolhidos = true

# Fase 4.5 (Q04): marcas que mudam o que o pagamento faz. Mesmo cabeçalho de estabelecimento do ST (trazem CPF_CNPJ: valem as
# regras de privacidade abaixo) e SGRUPHAB + CMPT_INI/CMPT_FIM (999999 = sem fim). Códigos próprios do CNES (60xx, 70xx, 71xx, 81xx,
# 82xx), que NÃO existem em tb_habilitacao do SIGTAP; o mesmo código de RC aparece no PA_REGCT e no REGCT do RD.
# Nem toda UF/competência tem o arquivo: a ausência no servidor não derruba o download.

[[tipo]]
codigo = "RC"
nome = "Regras contratuais"
chave = ["CNES", "CODUFMUN", "SGRUPHAB", "CMPT_INI", "CMPT_FIM", "COMPETEN"]
indices = [["CNES"], ["SGRUPHAB"]]

[[tipo]]
codigo = "IN"
nome = "Incentivos"
chave = ["CNES", "CODUFMUN", "SGRUPHAB", "CMPT_INI", "CMPT_FIM", "COMPETEN"]
indices = [["CNES"], ["SGRUPHAB"]]

[[tipo]]
codigo = "GM"
nome = "Gestão e metas"
chave = ["CNES", "CODUFMUN", "SGRUPHAB", "CMPT_INI", "CMPT_FIM", "COMPETEN"]
indices = [["CNES"], ["SGRUPHAB"]]

[[tipo]]
codigo = "EF"
nome = "Hospitais filantrópicos"
chave = ["CNES", "CODUFMUN", "SGRUPHAB", "CMPT_INI", "CMPT_FIM", "COMPETEN"]
indices = [["CNES"], ["SGRUPHAB"]]

# ---- Privacidade ----
# `sempre = true`: o campo nem vira coluna. Com `quando_campo`/`quando_valor`: o valor é apagado
# naquele registro. PF_PJ = "1" é pessoa física (IT_CNES_1706, campo PF_PJ: "1-Física 3-Jurídica").
# Tipo "CAD" é o cadastro de nomes (CADGER<UF>.dbf); a regra dele usa o PF_PJ do arquivo ST.

[[privacidade]]
tipos = ["ST", "HB", "SR", "LT", "EQ", "PF", "RC", "IN", "GM", "EF"]
campos = ["CPF_CNPJ"]
quando_campo = "PF_PJ"
quando_valor = "1"
motivo = "CPF do titular de estabelecimento pessoa física"

[[privacidade]]
tipos = ["ST"]
campos = ["CO_BANCO", "CO_AGENC", "C_CORREN"]
quando_campo = "PF_PJ"
quando_valor = "1"
motivo = "conta bancária de pessoa física"

[[privacidade]]
tipos = ["PF"]
campos = ["CPF_PROF", "CNS_PROF"]
sempre = true
motivo = "identificadores pessoais do profissional"

[[privacidade]]
tipos = ["CAD"]
campos = ["CPF_CNPJ", "RAZ_SOCI", "RSOC_MAN", "TELEFONE", "FAX", "EMAIL"]
quando_campo = "PF_PJ"
quando_valor = "1"
motivo = "dados pessoais do titular de estabelecimento pessoa física"

# ---- Decodificadores ----
# Campo -> arquivo CNV de TAB_CNES.zip, como os .def oficiais indicam. `campos` com dois nomes:
# o código é a junção dos dois (equipamento = TIPEQUIP + CODEQUIP, como em Equip_Tp.cnv).

# Decodificadores de RC, IN, GM e EF: o código é o SGRUPHAB do tipo (nomes virtuais RC_SGRUPHAB etc., porque o mesmo campo
# significa coisas diferentes em cada arquivo). Três vêm de .dbf do TAB_CNES.zip (colunas dadas) e um do .cnv.
[[decodificador]]
campos = ["RC_SGRUPHAB"]
arquivo = "REGRAS.DBF"
coluna_codigo = "CHAVE"
coluna_descricao = "DS_REGRA"
fonte = "TAB_CNES.zip DBF/REGRAS.DBF (19 regras contratuais; o texto já começa com o código)"

[[decodificador]]
campos = ["IN_SGRUPHAB"]
arquivo = "incentivos.dbf"
coluna_codigo = "CHAVE"
coluna_descricao = "DS_INCEN"
fonte = "TAB_CNES.zip DBF/incentivos.dbf (105 incentivos)"

[[decodificador]]
campos = ["GM_SGRUPHAB"]
arquivo = "GESTAO.dbf"
coluna_codigo = "CD_GESTAO"
coluna_descricao = "DS_GESTAO"
fonte = "TAB_CNES.zip DBF/GESTAO.dbf (9 tipos de contrato de gestão e metas)"

[[decodificador]]
campos = ["EF_SGRUPHAB"]
arquivo = "ESTABFIL.CNV"
fonte = "TAB_CNES.zip CNV/ESTABFIL.CNV (hospital filantrópico)"

[[decodificador]]
campos = ["TP_UNID"]
arquivo = "TP_ESTAB.CNV"
fonte = "Estabelecimento.def: Tipo de Estabelecimento"

[[decodificador]]
campos = ["TPGESTAO"]
arquivo = "TPGESTAO.CNV"
fonte = "Estabelecimento.def: Tipo de Gestão"

[[decodificador]]
campos = ["PF_PJ"]
arquivo = "TP_PFPJ.CNV"
fonte = "Estabelecimento.def: Pessoa Física/Jurídica"

[[decodificador]]
campos = ["ESFERA_A"]
arquivo = "EsferAdm.CNV"
fonte = "Estabelecimento.def: Esfera Administrativa"

[[decodificador]]
campos = ["NATUREZA"]
arquivo = "NATUREZA.CNV"
fonte = "Estabelecimento.def: Natureza da Organização"

[[decodificador]]
campos = ["NAT_JUR"]
arquivo = "NATJUR.CNV"
fonte = "Estabelecimento.def: Natureza Jurídica"

[[decodificador]]
campos = ["NIV_HIER"]
arquivo = "NIV_HIER.CNV"
fonte = "Estabelecimento.def: Nível Hierarquia"

[[decodificador]]
campos = ["TURNO_AT"]
arquivo = "TurnosAt.CNV"
fonte = "Estabelecimento.def: Turno Atendimento"

[[decodificador]]
campos = ["VINC_SUS"]
arquivo = "Vinc_SUS.cnv"
fonte = "Estabelecimento.def: Vínculos com SUS"

[[decodificador]]
campos = ["TP_LEITO"]
arquivo = "tip1leit.cnv"
fonte = "Leitos_Especialidade.def: Tipo/Especialidade"

[[decodificador]]
campos = ["CODLEITO"]
arquivo = "Esp_leit.CNV"
fonte = "Leitos_Especialidade.def: Especialidade"

# Equipamentos: a tabela mudou em 08/2025 (Equipamento.def: "Equipam a partir 202508"). Medido em
# EQMS2608: os 196 pares TIPEQUIP+CODEQUIP estão em equipam2508.cnv (em Equip_Tp.cnv, só 93).
# Para competências até 07/2025 não há decodificador conferido: o programa mostra só o código.
[[decodificador]]
campos = ["TIPEQUIP", "CODEQUIP"]
arquivo = "equipam2508.cnv"
desde = "202508"
fonte = "Equipamento.def: Equipam a partir 202508 (código = TIPEQUIP + CODEQUIP)"

[[decodificador]]
campos = ["VINCULAC"]
arquivo = "Vinculo.cnv"
fonte = "Profissional.def: Vínculo Empregatício"

# ---- Leito do CNES x tipo de leito do SIGTAP ----
# REGRA NÃO CONFIRMADA. O SIGTAP exige "tipo de leito" (tb_tipo_leito) e o CNES registra tipo
# (TP_LEITO) e especialidade (CODLEITO). Não achamos documento oficial com a correspondência.
# A tabela abaixo liga os dois pelo NOME igual nas duas fontes oficiais (tb_tipo_leito do SIGTAP
# 202609 x tip1leit.cnv e Esp_leit.CNV do TAB_CNES de 09/2026). O programa mostra o resultado
# sempre com o aviso de regra não confirmada.
# Sem linha aqui: vale o código igual (leitos complementares, 74 a 96, têm o mesmo código nas duas).

[[leito]]
sigtap = "01"
tp_leito = ["1"]
