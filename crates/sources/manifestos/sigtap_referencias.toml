# Referências entre tabelas do SIGTAP: de onde vem o nome de cada código (dados, não código).
#
# Uso: a ficha do procedimento e as telas de apoio trocam códigos por nomes, sempre na MESMA
# competência consultada. `de` lista as colunas (ou grupos de colunas) que apontam para a
# `chave` da `tabela`; `nomes` são as colunas de texto mostradas.
#
# Origem: nomes das colunas nos *_layout.txt dos 225 ZIPs (200801 a 202609) e descrições do
# Lay-out.xls. O teste `referencias_cobrem_o_banco` falha se alguma coluna CO_/NU_ de qualquer
# tabela ficar sem referência (e não for chave da própria tabela), e mede quantos códigos não
# encontram nome na mesma competência.

[[referencia]]
tabela = "tb_procedimento"
chave = ["co_procedimento"]
nomes = ["no_procedimento"]
de = [["co_procedimento"], ["co_procedimento_principal"], ["co_procedimento_compativel"], ["co_procedimento_restricao"], ["co_procedimento_origem"]]

