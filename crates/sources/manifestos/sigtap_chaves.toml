# Chaves naturais das tabelas do SIGTAP (dados, não código).
#
# Uso: comparar competências ("o que mudou") e mostrar histórico de uma mesma entidade.
# A reconstrução exata NÃO depende destas chaves (usa o conteúdo inteiro da linha).
#
# Origem: busca da menor combinação de colunas CO_/NU_/TP_ única em TODAS as competências em
# que a tabela existe, nos 225 ZIPs de 200801 a 202609 (estudo de 30/09/2026). Conferido de
# novo pelo teste `chaves_naturais_unicas` sobre o banco carregado.
#
# chave = []  → sem chave natural: há linhas inteiras repetidas (use o conteúdo + quantidade).

[chaves]
rl_excecao_compatibilidade = ["co_procedimento_restricao"]
rl_procedimento_cid = ["co_procedimento", "co_cid"]
rl_procedimento_comp_rede = ["co_procedimento"]
