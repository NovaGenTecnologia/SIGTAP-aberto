rl_procedimento_detalhe = ["co_procedimento", "co_detalhe"]
rl_procedimento_habilitacao = ["co_procedimento", "co_habilitacao", "nu_grupo_habilitacao"]
rl_procedimento_incremento = ["co_procedimento", "co_habilitacao"]
rl_procedimento_leito = ["co_procedimento", "co_tipo_leito"]
rl_procedimento_modalidade = ["co_procedimento", "co_modalidade"]
rl_procedimento_ocupacao = ["co_procedimento", "co_ocupacao"]
rl_procedimento_origem = ["co_procedimento", "co_procedimento_origem"]
rl_procedimento_registro = ["co_procedimento", "co_registro"]
rl_procedimento_regra_cond = ["co_procedimento", "co_regra_condicionada"]
rl_procedimento_renases = []  # linhas inteiras repetidas em 93 competências (201404 a 202303)
rl_procedimento_servico = ["co_procedimento", "co_servico", "co_classificacao"]
rl_procedimento_sia_sih = ["co_procedimento", "co_procedimento_sia_sih"]
