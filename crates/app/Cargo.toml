[package]
name = "sa-app"
description = "Aplicativo desktop do SIGTAP Aberto (Tauri 2, portátil)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sigtap-aberto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
sa-core = { path = "../core" }

[features]
# Serve a interface embutida no executável (sem servidor de desenvolvimento).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
