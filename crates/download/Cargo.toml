[package]
name = "sa-download"
description = "Download das fontes oficiais com cortesia, retomada e modo manual"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sa-core = { path = "../core" }
sa-sources = { path = "../sources" }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip", "win-system-proxy"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
