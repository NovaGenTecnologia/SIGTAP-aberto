[package]
name = "sa-unidade"
description = "Módulo CNES do usuário: baixar e carregar por UF, minha unidade, aptidão, rede, favoritos e exportação"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sa-core = { path = "../core" }
sa-sources = { path = "../sources" }
sa-packs = { path = "../packs" }
sa-download = { path = "../download" }
sa-query = { path = "../query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sa-download = { path = "../download", features = ["servidor-falso"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
