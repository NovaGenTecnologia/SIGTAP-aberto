<svg xmlns="http://www.w3.org/2000/svg" class="marca marca--padrao marca--carregando" viewBox="0 0 64 64" role="img" aria-label="SIGTAP Aberto"><title>SIGTAP Aberto</title><style>.marca{--cor-casco:#0A3D91}/* Marca SIGTAP Aberto. Esta folha é a única fonte do movimento: o componente e os SVGs animados de
   marca/animacao/ usam exatamente estas regras (o gerador as embute).

   Princípios:
   - Velocidade contínua: o brilho corre a linha a ~52 unidades por segundo e atravessa o anel na mesma
     velocidade HORIZONTAL (a que o olho acompanha), por isso o perfil do arco (--perfil-arco) não é linear
     no comprimento do arco: um arco a velocidade constante parece frear nas pontas do anel (96% da posição horizontal).
   - Sem transparência nas animações: o "apagado" é uma cor sólida (mistura do símbolo com o casco),
     para que traços que se tocam não escureçam nem clareiem na junção.
   - Só transform, clip-path, stroke e fill; a linha e o brilho ficam por baixo das células. */
.marca {
  display: block; flex: none;
  --m-casco: var(--cor-casco); --m-s: #fff; --m-nome: var(--cor-casco);
  --ease-saida: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-pop: cubic-bezier(0.34, 1.4, 0.64, 1);
  --perfil-arco: linear(0, 0.027 0.2%, 0.043 0.5%, 0.062 1%, 0.088 2%, 0.116 3.5%, 0.147 5.5%, 0.178 8%, 0.211 11%, 0.249 15%, 0.291 20%, 0.33 25%, 0.366 30%, 0.401 35%, 0.434 40%, 0.467 45%, 0.5 50%, 0.533 55%, 0.566 60%, 0.599 65%, 0.634 70%, 0.67 75%, 0.709 80%, 0.751 85%, 0.789 89%, 0.822 92%, 0.853 94.5%, 0.884 96.5%, 0.912 98%, 0.938 99%, 0.957 99.5%, 0.973 99.8%, 1);
}
.marca--negativo { --m-casco: #fff; --m-s: var(--cor-casco); --m-nome: #fff; }
.marca { --m-apagado: color-mix(in srgb, var(--m-s) 30%, var(--m-casco)); --m-suave: color-mix(in srgb, var(--m-s) 70%, var(--m-casco)); }
.marca--carregando { --m-base: var(--m-apagado); }
.marca--sutil { --m-base: var(--m-suave); }

.marca__casco { fill: var(--m-casco); }
.marca__cel { fill: var(--m-s); }
.marca__guia { fill: none; stroke: var(--m-s); stroke-width: 3; stroke-linecap: round; }
.marca__no { fill: none; stroke: var(--m-s); }
.marca__nome { fill: var(--m-nome); }
.marca__trilha, .marca__arco { fill: none; stroke: var(--m-s); stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 0; }
.marca__trilha { stroke-width: 3.2; }
.marca--pequena .marca__guia { stroke-width: 4; }
.marca--pequena .marca__trilha { stroke-width: 4.2; }

.marca__cel, .marca__casco, .marca__anel, .marca__nome { transform-box: fill-box; transform-origin: center; }

/* ───────── Inicialização (2 s no programa: 1,84 s de movimento + 0,16 s de saída) ─────────
   0,00  casco assenta (0,40 s)
   0,28  células entram em sequência, da esquerda ao centro, cima e baixo (0,30 s cada, 80 ms entre elas)
   0,72  linha-guia corre a 52 u/s (0,135 s)
   0,855 os dois arcos saem do ponto de entrada e se encontram à direita, na mesma velocidade horizontal (0,24 s)
   1,095 o anel pulsa uma vez: a conexão se fechou (0,20 s)
   1,00  SIGTAP se revela da esquerda para a direita; 1,15 Aberto, depois (0,50 s cada) */
.marca--inicial .marca__casco { animation: marca-casco 0.4s var(--ease-saida) both; }
.marca--inicial .marca__cel { animation: marca-pop 0.3s var(--ease-pop) both; }
.marca--inicial .marca__c4 { animation-delay: 0.28s; }
.marca--inicial .marca__c2 { animation-delay: 0.36s; }
.marca--inicial .marca__c1 { animation-delay: 0.44s; }
.marca--inicial .marca__c3 { animation-delay: 0.52s; }
.marca--inicial .marca__guia { stroke-dasharray: 1 2; animation: marca-oculto 0.72s linear, marca-traco 0.135s linear 0.72s both; }
.marca--inicial .marca__no { display: none; }
.marca--inicial .marca__arco { animation: marca-oculto 0.855s linear, marca-traco 0.24s var(--perfil-arco) 0.855s both; }
.marca--inicial .marca__anel { animation: marca-pulso 0.2s linear 1.095s both; }
.marca--inicial .marca__sigtap { animation: marca-revela 0.5s var(--ease-saida) 1s both; }
.marca--inicial .marca__aberto { animation: marca-revela 0.5s var(--ease-saida) 1.15s both; }
@keyframes marca-casco { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
@keyframes marca-pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
@keyframes marca-oculto { from, to { opacity: 0; } }
@keyframes marca-traco { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes marca-revela { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes marca-pulso {
  0% { transform: none; animation-timing-function: var(--ease-saida); }
  45% { transform: scale(1.14); animation-timing-function: ease-in-out; }
  100% { transform: none; }
}

/* ───────── Percurso do brilho (carregamento e sutil) ───────── */
.marca--carregando .marca__guia, .marca--carregando .marca__no,
.marca--sutil .marca__guia, .marca--sutil .marca__no { stroke: var(--m-base); }
.marca--carregando .marca__trilha, .marca--carregando .marca__arco,
.marca--sutil .marca__trilha, .marca--sutil .marca__arco { stroke: var(--m-base); animation-iteration-count: infinite; animation-timing-function: linear; }

/* Sutil (5 s): passa devagar (35 u/s), de tempos em tempos. */
.marca--sutil .marca__trilha, .marca--sutil .marca__arco { animation-duration: 5s; }
.marca--sutil .marca__trilha { animation-name: marca-trilha-lenta; }
.marca--sutil .marca__arco { animation-name: marca-arco-lento; }
.marca--sutil .marca__anel { animation: marca-pulso-lento 5s linear infinite; }
@keyframes marca-trilha-lenta {
  0%, 7.9% { stroke: var(--m-base); stroke-dashoffset: 1; }
  8% { stroke: var(--m-s); stroke-dashoffset: 1; }
  12%, 78% { stroke: var(--m-s); stroke-dashoffset: 0; }
  92%, 100% { stroke: var(--m-base); stroke-dashoffset: 0; }
}
@keyframes marca-arco-lento {
  0%, 11.9% { stroke: var(--m-base); stroke-dashoffset: 1; }
  12% { stroke: var(--m-s); stroke-dashoffset: 1; animation-timing-function: var(--perfil-arco); }
  18.9%, 78% { stroke: var(--m-s); stroke-dashoffset: 0; }
  92%, 100% { stroke: var(--m-base); stroke-dashoffset: 0; }
}
@keyframes marca-pulso-lento {
  0%, 18.9% { transform: none; animation-timing-function: var(--ease-saida); }
  21.5% { transform: scale(1.1); animation-timing-function: ease-in-out; }
  24% { transform: none; }
  100% { transform: none; }
}

/* Carregando: um fluxo contínuo, sem pausa nem emenda. Uma luz anda pelo caminho (esquerda, centro, cima, baixo,
   linha, anel) a velocidade constante e deixa um rastro que apaga devagar; o ciclo seguinte começa antes de o rastro
   anterior acabar. Cima e baixo entram depois do centro, um de cada vez e mais suaves, para não "estourar".
   A velocidade é um parâmetro só: --ciclo (1,4 s, ~43 unidades por segundo). Os instantes abaixo são frações dele. */
.marca--carregando { --ciclo: 1.4s; }
.marca--carregando .marca__cel { fill: var(--m-apagado); }
.marca--carregando .marca__c4 { animation: marca-cel var(--ciclo) linear infinite both; animation-delay: 0s; }
.marca--carregando .marca__c2 { animation: marca-cel var(--ciclo) linear infinite both; animation-delay: calc(var(--ciclo) * 0.308); }
.marca--carregando .marca__c1 { animation: marca-eco var(--ciclo) linear infinite both; animation-delay: calc(var(--ciclo) * 0.428); }
.marca--carregando .marca__c3 { animation: marca-eco var(--ciclo) linear infinite both; animation-delay: calc(var(--ciclo) * 0.548); }
.marca--carregando .marca__trilha { animation-name: marca-trilha-fluxo; animation-duration: var(--ciclo); animation-fill-mode: both; animation-delay: calc(var(--ciclo) * 0.523); }
.marca--carregando .marca__arco { animation-name: marca-arco-fluxo; animation-duration: var(--ciclo); animation-fill-mode: both; animation-delay: calc(var(--ciclo) * 0.640); }
@keyframes marca-cel { 0% { fill: var(--m-apagado); animation-timing-function: var(--ease-saida); } 10%, 20% { fill: var(--m-s); animation-timing-function: linear; } 75%, 100% { fill: var(--m-apagado); } }
@keyframes marca-eco { 0% { fill: var(--m-apagado); animation-timing-function: var(--ease-saida); } 22%, 32% { fill: var(--m-s); animation-timing-function: linear; } 87%, 100% { fill: var(--m-apagado); } }
@keyframes marca-trilha-fluxo {
  0% { stroke: var(--m-base); stroke-dashoffset: 1; }
  0.1% { stroke: var(--m-s); stroke-dashoffset: 1; }
  11.667%, 21.667% { stroke: var(--m-s); stroke-dashoffset: 0; animation-timing-function: linear; }
  76.667%, 100% { stroke: var(--m-base); stroke-dashoffset: 0; }
}
@keyframes marca-arco-fluxo {
  0% { stroke: var(--m-base); stroke-dashoffset: 1; }
  0.1% { stroke: var(--m-s); stroke-dashoffset: 1; animation-timing-function: var(--perfil-arco); }
  20%, 30% { stroke: var(--m-s); stroke-dashoffset: 0; animation-timing-function: linear; }
  85%, 100% { stroke: var(--m-base); stroke-dashoffset: 0; }
}

/* ───────── Redução de movimento ─────────
   A marca fica inteira e parada, exceto onde o movimento é a própria informação. A animação sutil é a
   versão de movimento reduzido: o carregamento deriva dela (brilho lento, 5 s). */
@media (prefers-reduced-motion: reduce) {
  .marca--inicial .marca__casco, .marca--inicial .marca__cel, .marca--inicial .marca__guia,
  .marca--inicial .marca__arco, .marca--inicial .marca__anel, .marca--inicial .marca__sigtap, .marca--inicial .marca__aberto,
  .marca--carregando .marca__c1, .marca--carregando .marca__c2, .marca--carregando .marca__c3, .marca--carregando .marca__c4 { animation: none; }
  .marca--carregando .marca__cel { fill: var(--m-s); }
  .marca--carregando { --m-base: var(--m-suave); }
  .marca--carregando .marca__guia, .marca--carregando .marca__no { stroke: var(--m-base); }
  .marca--carregando .marca__trilha, .marca--carregando .marca__arco { animation-duration: 5s; animation-delay: 0s; animation-fill-mode: none; }
  .marca--carregando .marca__trilha { animation-name: marca-trilha-lenta; }
  .marca--carregando .marca__arco { animation-name: marca-arco-lento; }
  .marca--carregando .marca__anel { animation: marca-pulso-lento 5s linear infinite; }
}
</style><g transform="translate(0 0) scale(1)"><rect class="marca__casco" width="64" height="64" rx="14"/><path class="marca__guia" d="M38.5 32H45.5" pathLength="1"/><path class="marca__trilha" d="M38.5 32H45.5" pathLength="1"/><rect class="marca__cel marca__c1" x="25.5" y="7" width="13" height="13" rx="3"/><rect class="marca__cel marca__c2" x="25.5" y="25.5" width="13" height="13" rx="3"/><rect class="marca__cel marca__c3" x="25.5" y="44" width="13" height="13" rx="3"/><rect class="marca__cel marca__c4" x="7" y="25.5" width="13" height="13" rx="3"/><g class="marca__anel"><circle class="marca__no" cx="51.5" cy="32" r="6" stroke-width="3"/><path class="marca__arco" d="M45.5 32A6 6 0 0 1 57.5 32" pathLength="1" stroke-width="3.2"/><path class="marca__arco" d="M45.5 32A6 6 0 0 0 57.5 32" pathLength="1" stroke-width="3.2"/></g></g></svg>
