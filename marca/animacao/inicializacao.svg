 260.97 30.6Q261.78 32.37 261.78 34.81V35.86H250.3Q250.3 37.38 250.8 38.61Q251.31 39.84 252.33 40.57Q253.35 41.3 254.92 41.3Q256.45 41.3 257.56 40.59Q258.67 39.87 258.98 38.53H261.68Q261.4 40.15 260.38 41.27Q259.37 42.38 257.95 42.95Q256.53 43.52 254.96 43.52ZM250.31 33.92H259.02Q259.02 32.54 258.56 31.43Q258.09 30.33 257.14 29.68Q256.19 29.04 254.75 29.04Q253.24 29.04 252.25 29.76Q251.26 30.48 250.78 31.6Q250.3 32.73 250.31 33.92ZM265.75 43.21V27.18H268.48V30.26Q268.88 29.12 269.61 28.37Q270.34 27.61 271.28 27.24Q272.22 26.87 273.22 26.87Q273.58 26.87 273.92 26.92Q274.26 26.96 274.45 27.07V29.85Q274.21 29.74 273.85 29.7Q273.49 29.66 273.24 29.66Q272.28 29.6 271.44 29.78Q270.6 29.95 269.97 30.39Q269.33 30.82 268.97 31.53Q268.6 32.23 268.6 33.24V43.21ZM283.3 43.28Q281.64 43.28 280.73 42.83Q279.81 42.38 279.45 41.5Q279.08 40.62 279.08 39.33V29.27H276.48V27.18H279.16L279.86 22.51H281.97V27.16H285.58V29.27H281.97V39.24Q281.97 40.09 282.14 40.49Q282.32 40.88 282.74 40.99Q283.16 41.1 283.92 41.1H285.67V43.02Q285.38 43.13 284.78 43.21Q284.18 43.28 283.3 43.28ZM295.48 43.52Q293.26 43.52 291.61 42.56Q289.96 41.61 289.05 39.77Q288.13 37.92 288.13 35.25Q288.13 32.74 288.99 30.85Q289.84 28.96 291.48 27.92Q293.12 26.87 295.5 26.87Q297.71 26.87 299.34 27.84Q300.97 28.81 301.87 30.68Q302.78 32.56 302.78 35.25Q302.78 37.7 301.94 39.56Q301.11 41.42 299.49 42.47Q297.87 43.52 295.48 43.52ZM295.5 41.25Q296.92 41.25 297.91 40.52Q298.91 39.8 299.43 38.43Q299.94 37.07 299.94 35.19Q299.94 33.47 299.49 32.1Q299.03 30.73 298.05 29.92Q297.08 29.12 295.5 29.12Q294.04 29.12 293.03 29.84Q292.02 30.56 291.51 31.92Q290.99 33.29 290.99 35.19Q290.99 36.88 291.44 38.26Q291.9 39.64 292.9 40.45Q293.9 41.25 295.5 41.25Z"/></g></svg>
